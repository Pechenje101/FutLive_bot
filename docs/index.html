<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutLive Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.5);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
        .status-live { background: #e74c3c; padding: 4px 10px; border-radius: 12px; font-size: 11px; animation: pulse 2s infinite; }
        .status-upcoming { background: #3498db; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .tabs-container { background: rgba(0,0,0,0.3); padding: 8px; display: flex; gap: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.05); color: #888; }
        .tab-btn.active { background: #e74c3c; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .match-info { padding: 12px 14px; text-align: center; background: rgba(255,255,255,0.05); }
        .match-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .match-meta { color: #888; font-size: 12px; }
        .league { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; font-size: 10px; }
        
        /* Player Container */
        .player-wrapper { background: #000; width: 100%; position: relative; }
        .player-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .player-iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #000; }
        .player-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #1a1a2e 0%, #2c3e50 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-overlay.hidden { opacity: 0; pointer-events: none; }
        .play-button { width: 70px; height: 70px; background: #e74c3c; border: none; border-radius: 50%; font-size: 28px; cursor: pointer; }
        .player-message { margin-top: 16px; color: #aaa; font-size: 13px; text-align: center; padding: 0 20px; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #e74c3c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .sources-section { padding: 10px 14px; }
        .section-title { font-size: 12px; color: #888; margin-bottom: 8px; }
        .source-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; }
        .source-flag { font-size: 22px; }
        .source-info { flex: 1; }
        .source-name { font-weight: 600; font-size: 14px; }
        .source-type { font-size: 11px; color: #888; }
        .source-btn { background: #e74c3c; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
        .source-btn.green { background: #2ecc71; }
        .source-btn.secondary { background: rgba(255,255,255,0.1); }
        
        .widget-container iframe { width: 100%; height: 800px; border: none; }
        .widget-filter { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; }
        .filter-btn { padding: 8px 14px; border: none; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; white-space: nowrap; }
        .filter-btn.active { background: #e74c3c; }
        .widget-info { padding: 14px; background: rgba(255,255,255,0.05); text-align: center; font-size: 12px; color: #888; }
        
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; z-index: 1000; max-width: 90%; }
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }
        .toast.success { background: #2ecc71; }
        
        .error-box { margin: 14px; padding: 14px; background: rgba(231,76,60,0.15); border: 1px solid #e74c3c; border-radius: 10px; text-align: center; }
        .error-box a { color: #3498db; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="logo"><span>⚽</span><span>FutLive</span></div>
            <div class="status-live" id="statusBadge">🔴 LIVE</div>
        </div>
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('player')">📺 Плеер</button>
            <button class="tab-btn" onclick="switchTab('matches')">📋 Матчи</button>
        </div>
        
        <div id="playerTab" class="tab-content active">
            <div class="match-info">
                <div class="match-title" id="matchTitle">Загрузка...</div>
                <div class="match-meta" id="matchMeta"></div>
            </div>
            
            <div class="player-wrapper">
                <div class="player-container">
                    <iframe id="playerIframe" class="player-iframe" style="display:none;" allowfullscreen></iframe>
                    <div class="player-overlay" id="playerOverlay">
                        <div class="loading-spinner" id="loadingSpinner" style="display:none;"></div>
                        <button class="play-button" id="playButton" onclick="loadEmbedPlayer()">▶</button>
                        <div class="player-message" id="playerMessage">Нажмите для просмотра</div>
                    </div>
                </div>
            </div>
            
            <div class="sources-section">
                <div class="section-title">📺 Способы просмотра:</div>
                <div id="sourcesList"></div>
            </div>
        </div>
        
        <div id="matchesTab" class="tab-content">
            <div class="widget-info">📺 Прямые трансляции с LiveTV</div>
            <div class="widget-filter">
                <button class="filter-btn active" onclick="filterSport(0)">⚽ Футбол</button>
                <button class="filter-btn" onclick="filterSport(1)">🏒 Хоккей</button>
                <button class="filter-btn" onclick="filterSport(2)">🏀 Баскетбол</button>
                <button class="filter-btn" onclick="filterSport(3)">🎾 Теннис</button>
            </div>
            <div class="widget-container">
                <iframe id="widgetIframe" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        
        const params = new URLSearchParams(window.location.search);
        const matchData = {
            title: params.get('title') || 'Выберите матч',
            time: params.get('time') || '',
            status: params.get('status') || '',
            league: params.get('league') || '',
            url: params.get('url') || '',
            acestreams: []
        };
        
        // Parse acestreams
        try {
            const as = params.get('acestreams');
            if (as) matchData.acestreams = JSON.parse(decodeURIComponent(as));
        } catch(e) {}
        if (matchData.acestreams.length === 0) {
            const single = params.get('acestream');
            if (single) matchData.acestreams = [single];
        }
        
        let embedUrl = null;
        let isLoading = false;
        
        function init() {
            document.getElementById('matchTitle').textContent = matchData.title;
            
            const isLive = matchData.status.includes('LIVE');
            const badge = document.getElementById('statusBadge');
            if (isLive) {
                badge.textContent = '🔴 LIVE';
                badge.className = 'status-live';
            } else {
                badge.textContent = '⏱️ ' + matchData.time;
                badge.className = 'status-upcoming';
            }
            
            let meta = matchData.time;
            if (matchData.league) meta += ' | <span class="league">' + matchData.league + '</span>';
            document.getElementById('matchMeta').innerHTML = meta;
            
            buildSources();
            loadWidget(0);
            
            // Auto-load player
            if (matchData.url) {
                loadEmbedPlayer();
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (tab === 'player' && i === 0) || (tab === 'matches' && i === 1));
            });
            document.getElementById('playerTab').classList.toggle('active', tab === 'player');
            document.getElementById('matchesTab').classList.toggle('active', tab === 'matches');
        }
        
        function loadWidget(sport) {
            document.getElementById('widgetIframe').src = `https://livetv.sx/export/webmasters.php?s=${sport}&lang=ru`;
        }
        
        function filterSport(sport) {
            document.querySelectorAll('.filter-btn').forEach((btn, i) => btn.classList.toggle('active', i === sport));
            loadWidget(sport);
        }
        
        function buildSources() {
            let html = '';
            
            // Main embed player button
            if (matchData.url) {
                html += `
                    <div class="source-item" onclick="loadEmbedPlayer()">
                        <div class="source-flag">🎬</div>
                        <div class="source-info">
                            <div class="source-name">Встроенный плеер</div>
                            <div class="source-type">LiveTV (без Ace Stream)</div>
                        </div>
                        <button class="source-btn green" onclick="event.stopPropagation(); loadEmbedPlayer()">▶ Смотреть</button>
                    </div>
                `;
            }
            
            // Ace Stream sources
            matchData.acestreams.forEach((link, i) => {
                const langs = ['🇷🇺 Русский', '🇬🇧 English', '🇩🇪 Deutsch', '🇪🇸 Español', '🇮🇹 Italiano'];
                const lang = langs[i] || '🌍 Other';
                html += `
                    <div class="source-item">
                        <div class="source-flag">${lang.split(' ')[0]}</div>
                        <div class="source-info">
                            <div class="source-name">${lang.split(' ')[1] || 'Ace Stream'}</div>
                            <div class="source-type">Требуется Ace Player</div>
                        </div>
                        <button class="source-btn secondary" onclick="copyLink('${link}')">📋</button>
                        <button class="source-btn" onclick="openAce('${link}')">🚀 Ace</button>
                    </div>
                `;
            });
            
            // Direct link to LiveTV
            if (matchData.url) {
                html += `
                    <div class="source-item" onclick="openExternal()">
                        <div class="source-flag">🌐</div>
                        <div class="source-info">
                            <div class="source-name">Открыть на LiveTV</div>
                            <div class="source-type">livetv.sx</div>
                        </div>
                        <button class="source-btn">🔗 Открыть</button>
                    </div>
                `;
            }
            
            if (!html) html = '<div style="color:#888;text-align:center;padding:20px;">Источники не найдены</div>';
            document.getElementById('sourcesList').innerHTML = html;
        }
        
        async function loadEmbedPlayer() {
            if (isLoading) return;
            if (!matchData.url) {
                showToast('Нет ссылки на матч', 'error');
                return;
            }
            
            isLoading = true;
            const overlay = document.getElementById('playerOverlay');
            const spinner = document.getElementById('loadingSpinner');
            const playBtn = document.getElementById('playButton');
            const message = document.getElementById('playerMessage');
            const iframe = document.getElementById('playerIframe');
            
            spinner.style.display = 'block';
            playBtn.style.display = 'none';
            message.textContent = 'Загрузка плеера...';
            
            try {
                // Try to get embed URL from our API
                const apiUrl = window.location.hostname === 'localhost' 
                    ? `/api/event?url=${encodeURIComponent(matchData.url)}`
                    : `https://livetv.sx/api/event?url=${encodeURIComponent(matchData.url)}`;
                
                // For now, try direct iframe embedding
                // Extract event ID from URL like: /eventinfo/ep123456_match_name/
                const eventMatch = matchData.url.match(/eventinfo\/([^\/]+)/);
                
                if (eventMatch) {
                    // Construct direct embed URL
                    const eventId = eventMatch[1];
                    // LiveTV embed pattern
                    const possibleUrls = [
                        `https://livetv.sx/ltvplayer/index.php?event=${eventId}`,
                        matchData.url,
                    ];
                    
                    // Try the first URL
                    embedUrl = possibleUrls[0];
                    iframe.src = embedUrl;
                    iframe.style.display = 'block';
                    overlay.classList.add('hidden');
                    showToast('Плеер загружен!', 'success');
                } else {
                    // Just embed the page directly
                    iframe.src = matchData.url;
                    iframe.style.display = 'block';
                    overlay.classList.add('hidden');
                    showToast('Загрузка страницы...', '');
                }
                
            } catch (e) {
                console.error('Embed error:', e);
                message.textContent = 'Ошибка загрузки';
                spinner.style.display = 'none';
                playBtn.style.display = 'block';
                showToast('Ошибка загрузки плеера', 'error');
            }
            
            isLoading = false;
        }
        
        function openAce(link) {
            const contentId = link.replace('acestream://', '');
            const isAndroid = /android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                window.location.href = `intent://${contentId}#Intent;scheme=acestream;package=org.acestream.media;end`;
            } else {
                window.location.href = link;
            }
            showToast('Открытие в Ace Player...', '');
        }
        
        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                showToast('Скопировано!', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = link;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Скопировано!', 'success');
            });
        }
        
        function openExternal() {
            if (matchData.url) {
                if (tg) tg.openLink(matchData.url);
                else window.open(matchData.url, '_blank');
            }
        }
        
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type ? ' ' + type : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
        
        init();
    </script>
</body>
</html>
