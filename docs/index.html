<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutLive Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.5);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
        .status-live { background: #e74c3c; padding: 4px 10px; border-radius: 12px; font-size: 11px; animation: pulse 2s infinite; }
        .status-upcoming { background: #3498db; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .tabs-container { background: rgba(0,0,0,0.3); padding: 8px; display: flex; gap: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.05); color: #888; }
        .tab-btn.active { background: #e74c3c; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .match-info { padding: 12px 14px; text-align: center; background: rgba(255,255,255,0.05); }
        .match-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .match-meta { color: #888; font-size: 12px; }
        .league { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; font-size: 10px; }
        
        /* Video Player Container */
        .player-wrapper { background: #000; width: 100%; }
        .video-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .video-container video, .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
        }
        .player-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #2c3e50 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .player-overlay.hidden { opacity: 0; pointer-events: none; }
        .play-button { width: 70px; height: 70px; background: #e74c3c; border: none; border-radius: 50%; font-size: 28px; cursor: pointer; }
        .player-message { margin-top: 16px; color: #aaa; font-size: 13px; text-align: center; padding: 0 20px; }
        
        .sources-section { padding: 10px 14px; }
        .section-title { font-size: 12px; color: #888; margin-bottom: 8px; }
        .source-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 8px; border: 2px solid transparent; }
        .source-item.playing { border-color: #2ecc71; background: rgba(46, 204, 113, 0.15); }
        .source-item.loading { border-color: #f39c12; }
        .source-flag { font-size: 22px; }
        .source-info { flex: 1; }
        .source-name { font-weight: 600; font-size: 14px; }
        .source-type { font-size: 11px; color: #888; }
        .source-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .source-action { background: #e74c3c; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }
        .source-copy { background: rgba(255,255,255,0.1); padding: 8px 10px; font-size: 14px; }
        .source-open { background: #2ecc71; }
        
        .widget-container iframe { width: 100%; height: 800px; border: none; }
        .widget-sport-filter { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; }
        .sport-filter-btn { padding: 8px 14px; border: none; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; white-space: nowrap; }
        .sport-filter-btn.active { background: #e74c3c; }
        .widget-info { padding: 14px; background: rgba(255,255,255,0.05); text-align: center; font-size: 12px; color: #888; }
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; opacity: 0; z-index: 1000; }
        .toast.show { opacity: 1; }
        .toast.error { background: #e74c3c; }
        .toast.success { background: #2ecc71; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #e74c3c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="logo"><span>⚽</span><span>FutLive</span></div>
            <div class="status-live" id="statusBadge">🔴 LIVE</div>
        </div>
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('player')">📺 Плеер</button>
            <button class="tab-btn" onclick="switchTab('widget')">📋 Все матчи</button>
        </div>
        
        <div id="playerTab" class="tab-content active">
            <div class="match-info">
                <div class="match-title" id="matchTitle">Загрузка...</div>
                <div class="match-meta" id="matchMeta"></div>
            </div>
            
            <div class="player-wrapper">
                <div class="video-container" id="videoContainer">
                    <video id="videoPlayer" playsinline controls></video>
                    <iframe id="embedPlayer" style="display:none;" allowfullscreen></iframe>
                    <div class="player-overlay" id="playerOverlay">
                        <div class="loading-spinner" id="loadingSpinner" style="display:none;"></div>
                        <button class="play-button" id="playButton" onclick="startPlayback()">▶</button>
                        <div class="player-message" id="playerMessage">Нажмите для просмотра</div>
                    </div>
                </div>
            </div>
            
            <div class="sources-section">
                <div class="section-title">📺 Источники трансляции:</div>
                <div id="sourcesList"></div>
            </div>
        </div>
        
        <div id="widgetTab" class="tab-content">
            <div class="widget-info">📺 Прямые трансляции с LiveTV</div>
            <div class="widget-sport-filter">
                <button class="sport-filter-btn active" onclick="filterSport(0)">⚽ Футбол</button>
                <button class="sport-filter-btn" onclick="filterSport(1)">🏒 Хоккей</button>
                <button class="sport-filter-btn" onclick="filterSport(2)">🏀 Баскетбол</button>
                <button class="sport-filter-btn" onclick="filterSport(3)">🎾 Теннис</button>
            </div>
            <div class="widget-container">
                <iframe id="liveWidget" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        
        const LANGUAGES = [
            {flag: '🇷🇺', name: 'Русский'},
            {flag: '🇬🇧', name: 'English'},
            {flag: '🇩🇪', name: 'Deutsch'},
            {flag: '🇪🇸', name: 'Español'},
            {flag: '🇮🇹', name: 'Italiano'},
            {flag: '🇫🇷', name: 'Français'},
            {flag: '🇵🇹', name: 'Português'},
            {flag: '🌍', name: 'Other'},
        ];
        
        const params = new URLSearchParams(window.location.search);
        const matchData = {
            title: params.get('title') || 'Выберите матч',
            time: params.get('time') || '',
            status: params.get('status') || '',
            league: params.get('league') || '',
            url: params.get('url') || '',
            acestreams: [],
            autoPlay: params.get('play') === '1'
        };
        
        try {
            const as = params.get('acestreams');
            if (as) matchData.acestreams = JSON.parse(decodeURIComponent(as));
        } catch(e) {}
        
        if (matchData.acestreams.length === 0) {
            const single = params.get('acestream');
            if (single) matchData.acestreams = [single];
        }
        
        let hls = null;
        let currentPlayingIndex = -1;
        let embedUrl = null;
        
        function init() {
            document.getElementById('matchTitle').textContent = matchData.title;
            
            const isLive = matchData.status.includes('LIVE');
            const badge = document.getElementById('statusBadge');
            if (isLive) {
                badge.textContent = '🔴 LIVE';
                badge.className = 'status-live';
            } else {
                badge.textContent = '⏱️ ' + matchData.time;
                badge.className = 'status-upcoming';
            }
            
            let meta = matchData.time;
            if (matchData.league) meta += ' | <span class="league">' + matchData.league + '</span>';
            document.getElementById('matchMeta').innerHTML = meta;
            
            buildSources();
            loadWidget(0);
            
            // Try to get embed URL from event page
            if (matchData.url) {
                fetchEmbedUrl(matchData.url);
            }
            
            if (matchData.autoPlay) {
                setTimeout(startPlayback, 500);
            }
        }
        
        async function fetchEmbedUrl(eventUrl) {
            try {
                // Use our API to fetch embed URL
                const apiUrl = `/api/embed?url=${encodeURIComponent(eventUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.embedUrl) {
                    embedUrl = data.embedUrl;
                    showToast('Найден встроенный плеер!', 'success');
                }
            } catch (e) {
                console.log('Embed fetch failed:', e);
            }
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === (tabName === 'player' ? 0 : 1));
            });
            document.getElementById('playerTab').classList.toggle('active', tabName === 'player');
            document.getElementById('widgetTab').classList.toggle('active', tabName === 'widget');
        }
        
        function loadWidget(sport) {
            document.getElementById('liveWidget').src = `https://livetv.sx/export/webmasters.php?s=${sport}&lang=ru`;
        }
        
        function filterSport(sport) {
            document.querySelectorAll('.sport-filter-btn').forEach((btn, i) => btn.classList.toggle('active', i === sport));
            loadWidget(sport);
        }
        
        function buildSources() {
            let html = '';
            
            matchData.acestreams.forEach((link, i) => {
                const lang = LANGUAGES[i] || LANGUAGES[LANGUAGES.length - 1];
                html += `
                    <div class="source-item" id="source-${i}">
                        <div class="source-flag">${lang.flag}</div>
                        <div class="source-info">
                            <div class="source-name">${lang.name}</div>
                            <div class="source-type">Ace Stream</div>
                        </div>
                        <div class="source-actions">
                            <button class="source-action source-copy" onclick="copyLink('${link}')">📋</button>
                            <button class="source-action" onclick="playSource(${i})">▶ Смотреть</button>
                        </div>
                    </div>
                `;
            });
            
            if (matchData.url) {
                html += `
                    <div class="source-item" id="source-web" onclick="openExternal()">
                        <div class="source-flag">🌐</div>
                        <div class="source-info">
                            <div class="source-name">Веб-плеер</div>
                            <div class="source-type">livetv.sx</div>
                        </div>
                        <button class="source-action source-open" onclick="event.stopPropagation(); loadEmbedPlayer()">▶ Смотреть</button>
                    </div>
                `;
            }
            
            if (!html) html = '<div style="color:#888;text-align:center;padding:20px;">Источники не найдены</div>';
            document.getElementById('sourcesList').innerHTML = html;
        }
        
        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                showToast('Ссылка скопирована!', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = link;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Ссылка скопирована!', 'success');
            });
        }
        
        async function startPlayback() {
            if (embedUrl) {
                loadEmbedPlayer();
            } else if (matchData.acestreams.length > 0) {
                playSource(0);
            } else if (matchData.url) {
                loadEmbedPlayer();
            }
        }
        
        function loadEmbedPlayer() {
            const embedFrame = document.getElementById('embedPlayer');
            const videoEl = document.getElementById('videoPlayer');
            const overlay = document.getElementById('playerOverlay');
            const spinner = document.getElementById('loadingSpinner');
            const playBtn = document.getElementById('playButton');
            const message = document.getElementById('playerMessage');
            
            spinner.style.display = 'block';
            playBtn.style.display = 'none';
            message.textContent = 'Загрузка плеера...';
            
            // If we have embed URL, use it
            if (embedUrl) {
                videoEl.style.display = 'none';
                embedFrame.style.display = 'block';
                embedFrame.src = embedUrl;
                overlay.classList.add('hidden');
                showToast('Плеер загружен!', 'success');
                return;
            }
            
            // Otherwise try to fetch embed from event URL
            if (matchData.url) {
                // Try direct iframe embedding from LiveTV
                // Extract event ID and construct embed URL
                const eventMatch = matchData.url.match(/eventinfo\/[^\/]+/);
                if (eventMatch) {
                    // LiveTV has an embed player
                    const embedSrc = `https://livetv.sx/ltvplayer/index.php?event=${eventMatch[0].replace('eventinfo/', '')}`;
                    videoEl.style.display = 'none';
                    embedFrame.style.display = 'block';
                    embedFrame.src = matchData.url;
                    overlay.classList.add('hidden');
                    showToast('Открываем страницу трансляции...', '');
                } else {
                    // Just open the URL in iframe
                    videoEl.style.display = 'none';
                    embedFrame.style.display = 'block';
                    embedFrame.src = matchData.url;
                    overlay.classList.add('hidden');
                }
            }
        }
        
        function playSource(index) {
            const sourceEl = document.getElementById('source-' + index);
            const link = matchData.acestreams[index];
            const contentId = link.replace('acestream://', '');
            const video = document.getElementById('videoPlayer');
            const embedFrame = document.getElementById('embedPlayer');
            const overlay = document.getElementById('playerOverlay');
            const message = document.getElementById('playerMessage');
            
            if (currentPlayingIndex >= 0) {
                const prev = document.getElementById('source-' + currentPlayingIndex);
                if (prev) prev.classList.remove('playing', 'loading');
            }
            
            sourceEl.classList.add('loading');
            message.textContent = 'Загрузка трансляции...';
            showToast('Подключение к Ace Stream...', '');
            
            // Try HLS directly (works if same origin or if Ace Stream Engine allows CORS)
            const hlsUrl = `http://127.0.0.1:6878/ace/manifest.m3u8?id=${contentId}`;
            
            embedFrame.style.display = 'none';
            video.style.display = 'block';
            
            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); hls = null; }
                
                hls = new Hls({ 
                    enableWorker: true, 
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 10000,
                    levelLoadingTimeOut: 10000
                });
                hls.loadSource(hlsUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    sourceEl.classList.remove('loading');
                    sourceEl.classList.add('playing');
                    currentPlayingIndex = index;
                    overlay.classList.add('hidden');
                    video.play().catch(() => showToast('Нажмите play'));
                    showToast('Трансляция загружена!', 'success');
                });
                
                hls.on(Hls.Events.ERROR, (_, data) => {
                    if (data.fatal) {
                        sourceEl.classList.remove('loading', 'playing');
                        overlay.classList.remove('hidden');
                        message.textContent = 'Ошибка: Ace Stream Engine не доступен';
                        showToast('Откройте в Ace Player', 'error');
                        
                        // Fallback: open in Ace Player
                        const isAndroid = /android/i.test(navigator.userAgent);
                        if (isAndroid) {
                            window.location.href = `intent://${contentId}#Intent;scheme=acestream;package=org.acestream.media;end`;
                        } else {
                            window.location.href = link;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = hlsUrl;
                video.addEventListener('loadedmetadata', () => {
                    sourceEl.classList.remove('loading');
                    sourceEl.classList.add('playing');
                    currentPlayingIndex = index;
                    overlay.classList.add('hidden');
                    video.play().catch(() => {});
                }, { once: true });
            } else {
                showToast('HLS не поддерживается', 'error');
                sourceEl.classList.remove('loading');
            }
        }
        
        function openExternal() {
            if (matchData.url) {
                if (tg) tg.openLink(matchData.url);
                else window.open(matchData.url, '_blank');
            }
        }
        
        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type ? ' ' + type : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
        
        init();
    </script>
</body>
</html>
